name: Deploy to GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOOGLE_TIPS_CSV_URL: ${{ vars.GOOGLE_TIPS_CSV_URL }}
  GOOGLE_TOOLS_CSV_URL: ${{ vars.GOOGLE_TOOLS_CSV_URL }}
  GOOGLE_CROWDFUNDING_CSV_URL: ${{ vars.GOOGLE_CROWDFUNDING_CSV_URL }}
  GOOGLE_GAMES_CSV_URL: ${{ vars.GOOGLE_GAMES_CSV_URL }}
  GOOGLE_CONTESTS_CSV_URL: ${{ vars.GOOGLE_CONTESTS_CSV_URL }}
  GOOGLE_WIPS_CSV_URL: ${{ vars.GOOGLE_WIPS_CSV_URL }}
  GOOGLE_POLL_RESULTS_CSV_URL: ${{ vars.GOOGLE_POLL_RESULTS_CSV_URL }}

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'  # Rebuild hourly with latest sheet data

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update data from Google Sheets
        run: |
          if [ -n "$GOOGLE_TIPS_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_TIPS_CSV_URL" -o assets/tips.csv
            test -s assets/tips.csv
          fi
          
          if [ -n "$GOOGLE_TOOLS_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_TOOLS_CSV_URL" -o assets/tools.csv
            test -s assets/tools.csv
          fi

          if [ -n "$GOOGLE_CROWDFUNDING_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_CROWDFUNDING_CSV_URL" -o assets/crowdfunding.csv
            test -s assets/crowdfunding.csv
          fi

          if [ -n "$GOOGLE_GAMES_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_GAMES_CSV_URL" -o assets/games.csv
            test -s assets/games.csv
          fi

          if [ -n "$GOOGLE_CONTESTS_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_CONTESTS_CSV_URL" -o assets/contests.csv
            test -s assets/contests.csv
          fi

          if [ -n "$GOOGLE_WIPS_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_WIPS_CSV_URL" -o assets/wips.csv
            test -s assets/wips.csv
          fi

          if [ -n "$GOOGLE_POLL_RESULTS_CSV_URL" ]; then
            curl -fsSL "$GOOGLE_POLL_RESULTS_CSV_URL" -o assets/poll-results.csv
            test -s assets/poll-results.csv
          fi

      - name: Build editorial pages from Markdown
        run: node scripts/build-posts.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
