name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 * * * *'  # Rebuild hourly with latest sheet data

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update data from Google Sheets
        run: |
          # Replace these with your actual Google Sheet CSV URLs
          # For tips: https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/export?format=csv&gid=0
          # For tools: https://docs.google.com/spreadsheets/d/YOUR_SHEET_ID/export?format=csv&gid=1
          
          if [ -n "$GOOGLE_TIPS_CSV_URL" ]; then
            curl -sL "$GOOGLE_TIPS_CSV_URL" > assets/tips.csv || echo "Using default tips"
          fi
          
          if [ -n "$GOOGLE_TOOLS_CSV_URL" ]; then
            curl -sL "$GOOGLE_TOOLS_CSV_URL" > assets/tools.csv || echo "Using default tools"
          fi

          if [ -n "$GOOGLE_GAMES_CSV_URL" ]; then
            curl -sL "$GOOGLE_GAMES_CSV_URL" > assets/games.csv || echo "Using default games"
          fi

      - name: Build editorial pages from Markdown
        run: node scripts/build-posts.mjs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

env:
  GOOGLE_TIPS_CSV_URL: ${{ vars.GOOGLE_TIPS_CSV_URL }}
  GOOGLE_TOOLS_CSV_URL: ${{ vars.GOOGLE_TOOLS_CSV_URL }}
  GOOGLE_GAMES_CSV_URL: ${{ vars.GOOGLE_GAMES_CSV_URL }}
