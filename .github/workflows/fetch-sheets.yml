name: Automated Google Sheets Fetcher

on:
  schedule:
    - cron: '0 * * * *'  # Hourly check (adjust as needed)

jobs:
  fetch-sheets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Fetch Tips CSV
        run: |
          curl -sL "${{ vars.GOOGLE_TIPS_CSV_URL }}" > assets/tips.csv || echo "Failed to fetch"
          
      - name: Fetch Tools CSV  
        run: |
          curl -sL "${{ vars.GOOGLE_TOOLS_CSV_URL }}" > assets/tools.csv || echo "Failed to fetch"

      - name: Fetch Games CSV
        run: |
          curl -sL "${{ vars.GOOGLE_GAMES_CSV_URL }}" > assets/games.csv || echo "Failed to fetch"
          
      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/
          if git diff --cached --quiet; then
            echo "No CSV changes to commit"
            exit 0
          fi
          git commit -m "Update CSV data from Google Sheets"
          git pull --rebase origin main
          git push origin main
